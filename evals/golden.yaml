# Golden dataset — 30 tasks.
#
# 20 answerable: the answer must contain the expected facts, must not
#   contain the forbidden facts, and must cite the source doc.
# 4 strict: answerable, but the citation must be exactly the one doc.
# 6 abstain: the corpus does not cover the question; the only passing
#   answer is the fixed abstention with no citations.
#
# Expectations reach the graders (evals/grade.mjs) through the `expect`
# var as a JSON string. notContains values are plausible-sounding wrong
# facts that appear nowhere in the corpus — an extractive mock cannot
# invent them; a live model can, which is what these checks exist for.

# ---------------- answerable (20) ----------------

- description: 'A01 refunds: money-back guarantee'
  vars:
    question: "What is the refund policy?"
    kind: answerable
    expect: '{"contains":["30-day"],"cite":"refunds"}'
  assert:
    - type: javascript
      value: file://grade.mjs
      metric: task

- description: 'A02 pricing: Pro monthly price'
